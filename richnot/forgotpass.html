<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forgotpass.css">
    <title>Forgot Password</title>
</head>
<body>

    <div class="forgot-password">
        <div class="mail-circle">
            <svg class="mail-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="16" height="12" rx="1" fill="none" stroke-width="2"/>
                <path d="M4 7L12 13L20 7" fill="none" stroke-width="2"/>
            </svg>
        </div>

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll<br>
            send you instructions to reset your password.
        </p>
    </div>
    
    <form id="forgotForm">
        <label for="emailform">Email Address</label>
        <div class="input-container" style="width:100%; height:45px; border:1px solid #ddd; border-radius:7px; padding:0 14px; display:flex; align-items:center;">
            <input id="emailform" type="email" placeholder="Enter your email address" style="width:100%; border:none; outline:none; font-size:13px;">
        </div>
        <div class="error-message" id="emailError"></div>
        <button class="resetbtn" type="submit">Send Reset Link</button>
    </form>

    <script src='forgotpass.js'></script>
</body>
</html>
