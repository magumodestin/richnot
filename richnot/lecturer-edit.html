<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<main class="main">
    <div class="top-bar">
        <button class="hamburger-btn" onclick="openSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        
        <div class="page-header">
            <div>
                <a href="lecturer-materials.html" class="back-link">← Back</a>
                <h1>Edit Material</h1>
                <p>Update the material details.</p>
            </div>
        </div>
    </div>

    <div class="edit-form">
        <form id="editForm">
            <div class="form-group">
                <label class="form-label">Material Title</label>
                <input type="text" class="form-input" id="title" value="Introduction to SQL">
            </div>

            <div class="form-group">
                <label class="form-label">Module</label>
                <select class="form-select" id="module">
                    <option value="DFS101" selected>Database Systems</option>
                    <option value="NET202">Networking</option>
                    <option value="PYT310">Python Programming</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Material Type</label>
                <select class="form-select" id="type">
                    <option value="pdf" selected>PDF</option>
                    <option value="slides">Slides</option>
                    <option value="notes">Lecture Notes</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <textarea class="form-input" id="description" rows="3">Introduction to SQL concepts</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Current File</label>
                <div class="current-file">
                    <div class="file-icon pdf">PDF</div>
                    <div class="file-info">
                        <h4>Introduction to sql.pdf</h4>
                        <p>1.2 MB</p>
                    </div>
                    <button type="button" class="btn-replace" onclick="document.getElementById('fileInput').click()">Replace File</button>
                    <input type="file" id="fileInput" style="display:none;" onchange="showFileName(this)">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="location.href='lecturer-materials.html'">Cancel</button>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>
        </form>
        
        <div class="success-message" id="successMsg">
            ✅ Changes saved successfully!
        </div>
    </div>
</main>

<script src= "lecturer-edit.js"></script>

</body>
</html>
