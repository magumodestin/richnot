<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset-pass.css">
    <title>Reset Password</title>
</head>
<body>

<div class="reset-card">
   <h1 class="reset-title">Reset Password</h1>
   
   <div class="mail-circle">
     <svg class="mail-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
       <rect x="4" y="11" width="16" height="11" rx="2" ry="2" fill="none" stroke="#2929a8" stroke-width="2"></rect>
       <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#2929a8" stroke-width="2"></path>
     </svg>
   </div>

   <p class="reset-subtitle">Enter Your New Password</p>

   <form class="login-form" id="loginForm">
       <div class="form-group">
           <label class="form-label">Password</label>
           <div class="input-container">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C8593" stroke-width="1.7">
                   <rect x="5" y="10" width="14" height="10" rx="2"/>
                   <path d="M8 10V7.5C8 5.5 9.6 4 12 4C14.4 4 16 5.5 16 7.5V10"/>
               </svg>
               <input type="password" placeholder="Enter your password" required>
           </div>
       </div>

       <div class="form-group">
           <label class="form-label">Confirm Password</label>
           <div class="input-container">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C8593" stroke-width="1.7">
                   <rect x="5" y="10" width="14" height="10" rx="2"/>
                   <path d="M8 10V7.5C8 5.5 9.6 4 12 4C14.4 4 16 5.5 16 7.5V10"/>
               </svg>
               <input type="password" placeholder="Enter your password" required>
               <button type="button" class="password-toggle">
                   <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                       <path d="M2 12S5.5 5.5 12 5.5S22 12 22 12S18.5 18.5 12 18.5S2 12 2 12Z"/>
                       <circle cx="12" cy="12" r="2.5"/>
                   </svg>
               </button>
           </div>
       </div>

       <button type="submit" class="resert-btn">Reset Password</button>
   </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("loginForm");
    const passwords = document.querySelectorAll('input[type="password"]');
    const toggleButtons = document.querySelectorAll('.password-toggle');
    
    // Password visibility toggle
    toggleButtons.forEach(function(btn, index) {
        btn.addEventListener("click", function() {
            const input = passwords[index + 1]; // Skip first password field
            if (input && input.type === "password") {
                input.type = "text";
            } else if (input) {
                input.type = "password";
            }
        });
    });
    
    // Reset password form
    form.addEventListener("submit", function(e) {
        e.preventDefault();
        
        const newPassword = passwords[0].value;
        const confirmPassword = passwords[1].value;
        const resetEmail = localStorage.getItem("resetEmail");
        
        // Validate
        if (newPassword.length < 6) {
            alert("Password must be at least 6 characters long.");
            return;
        }
        
        if (newPassword !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }
        
        if (!resetEmail) {
            alert("No password reset session found. Please try again.");
            return;
        }
        
        // Update user password
        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const userIndex = users.findIndex(u => u.email === resetEmail);
        
        if (userIndex !== -1) {
            users[userIndex].password = newPassword;
            localStorage.setItem("users", JSON.stringify(users));
            localStorage.removeItem("resetEmail");
            
            alert("Password reset successful! Please login with your new password.");
            setTimeout(function() {
                window.location.href = "home.html";
            }, 1500);
        } else {
            alert("User not found. Please try again.");
        }
    });
});
</script>
</body>
</html>
